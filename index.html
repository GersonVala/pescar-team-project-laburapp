<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaburAPP</title>

    <!-- Referencia a los estilos hechos en CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">

</head>
<body>
    
    <!-- Boton del chat -->
    <button class="chat-trigger" aria-label="Abrir chat">
        💬
    </button>

    <!-- Ventana flotante del chat -->
    <div class="help-window-1">

        <!-- Cabeza de la ventana - estatico -->
        <div class="chat-header">
            <div class="chat-header-space"></div>
            <div class="chat-title">
                <h3>Chat con Labu</h3>
            </div>
            <div class="chat-header-actions">
                <button class="chat-user-history-btn" aria-label="Ver conversaciónes anteriores">
                    H
                </button>
                <button class="chat-close-btn" aria-label="Cerrar ventana de chat">
                    ✕
                </button>
            </div>
        </div>

        <!-- Cuerpo de la ventana de ayuda -->
        <div class="chat-body">
            <!-- Pantallas de las ventanas de ayuda -->
            <!-- ! w:window o:option -->

            <!-- x Primera ventana - Opciones-->
            <div class="chat-window is-hidden" id="Wx">
                <button class="chat-option-btn" id="btn-primera-vez">
                    Es la primera vez que usas LaburAPP?
                </button>
                
                <button class="chat-option-btn" id="btn-busco-contratar">
                    Busco un profesional / oficio
                </button>
                
                <button class="chat-option-btn" id="btn-busco-solicitudes">
                    Busco solicitudes de trabajo
                </button>
                
                <button class="chat-option-btn" id="btn-iniciar-chat-labu">
                    Hablar con Labu
                </button>
            </div>

            <!-- 1.x - Opciones-->
            <div class="chat-window is-hidden" id="W1-x">
                <button class="chat-option-btn" id="btn-quiero-registrarme">
                    Quiero registrarme
                </button>
            
                <button class="chat-option-btn" id="btn-tutorial">
                    Tutorial por la página
                </button>
            
                <button class="chat-option-btn" id="btn-preguntas-frecuentes">
                    Preguntas Frecuentes
                </button>
            
                <button class="chat-option-btn" id="btn-iniciar-chat-labu-W1">
                    Hablar con Labu
                </button>
            </div>

            <!-- 1.1.x  - Opciones-->
            <div class="chat-window is-hidden" id="W1-1-x">
                <button class="chat-option-btn" id="btn-quiero-ofrecer-servicios">
                    Quiero ofrecer servicios
                </button>
            
                <button class="chat-option-btn" id="btn-quiero-contratar-servicios">
                    Quiero contratar servicios
                </button>
                
                <!-- TODO : Agregar una nota que diga que se pueden hacer ambas -->
            </div> 

            <!-- 1.3.x  - Opciones-->
            <div class="chat-window is-hidden" id="W1-3-x">
                <button class="chat-option-btn" id="btn-como-subir-trabajos">
                    ¿Como puedo subir fotos de mis trabajos?
                </button>
            
                <button class="chat-option-btn" id="btn-hacer-una-pregunta">
                    Hacer una pregunta
                </button>
            
            </div>

            <!-- 2.x  - Opciones-->
            <div class="chat-window is-hidden" id="W2-x">
                <button class="chat-option-btn" id="btn-buscar-profesionales">
                    Buscar profesionales / servicios
                </button>
            
                <button class="chat-option-btn" id="btn-calculadora-costos">
                    Calculadora de costos
                </button>

                <button class="chat-option-btn" id="btn-profesionales-destacados">
                     Ver profesionales destacados
                </button>

                <button class="chat-option-btn" id="btn-garantia">
                    Nuestra Garantía
                </button> 

            
            </div>

            <!-- 3.x  - Opciones-->
            <div class="chat-window is-hidden" id="W3-x">
                <button class="chat-option-btn" id="btn-consejos-mejorar-perfil">
                    Consejos para mejorar mi perfil
                </button>
            
                <button class="chat-option-btn" id="btn-calculadora">
                    Calculadora de costos
                </button>
            
            </div>

            <div class="chat-window" id="W-chat-labu">

                <div class="chat-messages" id="chat-messages">
                    <div class="message labu-message">
                        ¡Hola! Soy Labu. ¿En que puedo ayudarte?
                    </div>

                    <div class="message user-message">
                        Hola, necesito información sobre el registro
                    </div>

                    <div class="message labu-message">
                        Mensaje chiquito
                    </div>

                </div>

                <form class="chat-input-area" id="chat-form">
                    <input
                        type="text"
                        placeholder="Escribi tu mensaje..."
                        id="chat-input"
                        aria-label="cuadro para escribir mensajes al chat"
                        autocomplete="off"
                    >

                    <button
                        type="submit"
                        class="chat-send-btn"
                        aria-label="Enviar mensaje">
                        ➤
                    </button>

                </form>

            </div>

        </div>

    </div>

    
<!-- Referencia al javascript -->
<script src="js/script.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
