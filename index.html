<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaburAPP</title>

    <!-- Referencia a los estilos hechos en CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
    <!-- Boton del chat -->
    <button class="chat-trigger" aria-label="Abrir chat">
        💬
    </button>

    <!-- Ventana flotante del chat -->
    <div class="help-window-1">

        <!-- Cabeza de la ventana - estatico -->
        <div class="chat-header">
            <div class="chat-header-space"></div>
            <div class="chat-title">
                <h3>Chat con Labu</h3>
            </div>
            <div class="chat-header-actions">
                <button class="chat-user-history-btn" aria-label="Ver conversaciónes anteriores">
                    H
                </button>
                <button class="chat-close-btn" aria-label="Cerrar ventana de chat">
                    ✕
                </button>
            </div>
        </div>

        <!-- Cuerpo de la ventana de ayuda -->
        <div class="chat-body">
            <!-- Pantallas de las ventanas de ayuda -->
            <!-- ! w:window o:option -->

            <!-- x Primera ventana - Opciones-->
            <div class="chat-window" id="Wx">
                <button class="chat-option-btn">
                    Es la primera vez que usas LaburAPP?
                </button>
                
                <button class="chat-option-btn">
                    Busco un profesional / oficio
                </button>
                
                <button class="chat-option-btn">
                    Busco solicitudes de trabajo
                </button>
                
                <button class="chat-option-btn">
                    Hablar con Labu
                </button>
            </div>

            <!-- 1.x - Opciones-->
            <div class="chat-window is-hidden" id="W1-x">
                <button class="chat-option-btn">
                    Quiero registrarme
                </button>
            
                <button class="chat-option-btn">
                    Tutorial por la página
                </button>
            
                <button class="chat-option-btn">
                    Preguntas Frecuentes
                </button>
            
                <button class="chat-option-btn">
                    Hablar con Labu
                </button>
            </div>

            <!-- 1.1.x  - Opciones-->
            <div class="chat-window is-hidden" id="W1-1-x">
                <button class="chat-option-btn">
                    Quiero ofrecer servicios
                </button>
            
                <button class="chat-option-btn">
                    Quiero contratar servicios
                </button>
                
                <!-- TODO : Agregar una nota que diga que se pueden hacer ambas -->
            </div> 

            <!-- 1.3.x  - Opciones-->
            <div class="chat-window is-hidden" id="W1-3-x">
                <button class="chat-option-btn">
                    ¿Como puedo subir fotos de mis trabajos?
                </button>
            
                <button class="chat-option-btn">
                    Hacer una pregunta
                </button>
            
            </div>

            <!-- 2.x  - Opciones-->
            <div class="chat-window is-hidden" id="W2-x">
                <button class="chat-option-btn">
                    Buscar profesionales / servicios
                </button>
            
                <button class="chat-option-btn">
                    Calculadora de costos
                </button>

                <button class="chat-option-btn">
                     Ver profesionales destacados
                </button>

                <button class="chat-option-btn">
                    Nuestra Garantía
                </button> 

            
            </div>

            <!-- 3.x  - Opciones-->
            <div class="chat-window is-hidden" id="W3-x">
                <button class="chat-option-btn">
                    Buscar profesionales / servicios
                </button>
            
                <button class="chat-option-btn">
                    Calculadora de costos
                </button>
            
                <button class="chat-option-btn">
                    Ver profesionales destacados
                </button>
            
                <button class="chat-option-btn">
                    Nuestra Garantía
                </button>
            </div>

        </div>

    </div>

    
<!-- Referencia al javascript -->
<script src="js/script.js"></script>

</body>
</html>
